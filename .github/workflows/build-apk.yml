name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Build Environment
        run: |
          # Ensure .env exists from example if not already committed, to satisfy secrets plugin
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          # Ensure dummy google-services.json exists if missing to satisfy Google Services plugin
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.aistudio.planttrack.ptapp"}},"oauth_client":[],"api_key":[{"current_key":""}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Output
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Debug APK built successfully at app/build/outputs/apk/debug/app-debug.apk"
            ls -lh app/build/outputs/apk/debug/
          else
            echo "Error: app-debug.apk was not found in app/build/outputs/apk/debug/"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantTrack-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
